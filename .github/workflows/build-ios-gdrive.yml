# Google Drive input build for mizukico/nxnative, following mizukico/Bayo3-T's
# .github/workflows/build.yml: the game package and prod.keys are Google Drive links kept in
# repository secrets and fetched with gdown (resumable, retried), instead of a Baidu Netdisk
# login that Baidu currently answers with errno -6 ("please log in again") for ls and download.
# The nxnative source is this fork's main, which carries the Korean/Asian 1.0.7
# dm/games/01001E9023920000 profile.
# Required repository secrets: Game_URL, Keys_URL. Update_URL is optional: a merged XCI carries
# its update partition itself, so leave it unset. Builds an unsigned iOS IPA and uploads the
# IPA and the RomFS image as GitHub Artifacts; no signing and no Baidu credentials are needed.
name: NxNative - iOS IPA Builder (Google Drive input)

on:
  workflow_dispatch:
    inputs:
      base_title_id:
        description: "Base game title ID (16 hex). Default 01001E9023920000 = Trails in the Sky 1st Chapter (Korean/Asian 1.0.7, profile in dm/games); clear to auto-detect from the package."
        required: false
        type: string
        default: "01001E9023920000"
      game_url:
        description: "Google Drive share link or file ID of the game package (NSP/XCI) for this run; empty = the Game_URL secret"
        required: false
        type: string
        default: ""
      keys_url:
        description: "Google Drive share link or file ID of prod.keys for this run; empty = the Keys_URL secret"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    # Only the repository owner may execute the build job.
    if: github.actor == github.repository_owner
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      # The nxnative source is this fork (main carries the Korean 1.0.7 profile and PR #1002),
      # not seedds/nxnative: upstream main has neither dm/games/01001E9023920000 nor
      # dm/games/01002C9022770000.
      - name: Checkout nxnative fork main
        uses: actions/checkout@v4
        with:
          repository: mizukico/nxnative
          ref: main

      - name: Checkout workflow helper
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: workflow-tools

      - name: Verify the profile and warn about iOS address space
        shell: bash
        env:
          BASE_TITLE_ID: ${{ inputs.base_title_id }}
        run: |
          set -euo pipefail
          TITLE_ID="$(echo "${BASE_TITLE_ID:-01001E9023920000}" | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$TITLE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::base_title_id must be exactly 16 hexadecimal characters, got: $TITLE_ID"
            exit 1
          fi
          if [[ ! -f "dm/games/$TITLE_ID/game.tsv" ]]; then
            echo "::error::No profile at dm/games/$TITLE_ID/game.tsv. The build would fall back to a provisional profile and most likely fail; use a title ID with a profile."
            exit 1
          fi
          python - "$TITLE_ID" <<'PY'
          import sys
          from pathlib import Path
          tid = sys.argv[1]
          keys = {}
          for line in (Path('dm/games') / tid / 'game.tsv').read_text().splitlines():
              line = line.strip()
              if not line or line.startswith('#') or '\t' not in line:
                  continue
              key, value = line.split('\t', 1)
              keys[key] = value
          reserve = int(keys.get('mem_reserve', '0'), 0)
          alias = int(keys.get('mem_alias', '0'), 0)
          print(f"profile {tid}: mem_reserve={reserve:#x} ({reserve / 2**30:.2f} GiB), mem_alias={alias:#x} ({alias / 2**30:.2f} GiB)")
          if reserve > 6 * 2**30:
              print(f"::warning::mem_reserve is {reserve:#x}, over the ~6 GiB single reservation iOS grants without the extended-virtual-addressing entitlement. Unless dm/games/{tid}/patches.py lowers the game's own reservation, the IPA will stop at launch with FATAL reserve guest AS.")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply CI disk-safe shader and RomFS patches
        shell: bash
        run: |
          set -euo pipefail
          GUARD="$GITHUB_WORKSPACE/workflow-tools/.github/scripts/nxnative_ci_guard.py"
          python "$GUARD" patch "$GITHUB_WORKSPACE"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install glslang xcodegen zstd spirv-cross unar
          python -m pip install --upgrade pip

          # Install the exact, pinned Python toolchain maintained by upstream.
          python -m pip install -r .github/requirements/tools.txt
          python -m pip install gdown

          # Python 3.13 does not include compression.zstd in the standard library.
          if python -c 'import sys; raise SystemExit(sys.version_info >= (3, 14))'; then
            python -m pip install backports.zstd
          fi

      - name: Remove stale NxNative temporary files
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/workflow-tools/.github/scripts/nxnative_ci_guard.py" preclean "$RUNNER_TEMP"
      # ==========================================
      # Download source: Google Drive links (secrets Game_URL / Keys_URL)
      # ==========================================
      - name: Download the game package and keys from Google Drive
        env:
          GAME_URL: ${{ inputs.game_url || secrets.Game_URL }}
          KEYS_URL: ${{ inputs.keys_url || secrets.Keys_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          # gdown takes a share link or a bare file ID, resumes with --continue, and is retried
          # here: Google throttles large files per session, and a resumed transfer keeps what it
          # already fetched.
          download_file() {
            local url="$1"
            local output="$2"
            if [[ -z "${url:-}" ]]; then
              echo "::error::No Google Drive link for $(basename "$output"): set the workflow input or the repository secret."
              exit 1
            fi
            echo "Downloading $(basename "$output")..."
            for attempt in 1 2 3; do
              if gdown --continue "$url" -O "$output" >/dev/null 2>&1 && [[ -s "$output" ]]; then
                file "$output"
                ls -l "$output"
                return
              fi
              echo "Download attempt $attempt failed; retrying..."
              sleep $((attempt * 10))
            done
            echo "::error::Failed to download $(basename "$output") after 3 attempts."
            exit 1
          }

          download_file "$GAME_URL" "$WORK/game.download"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          # A merged XCI carries the update partition, so UPDATE_URL usually stays unset.
          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without a separate update."
          fi
          chmod 600 "$WORK/prod.keys"

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"
          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }
          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )
          def read_magic(path, offset=0):
              with path.open("rb") as f:
                  f.seek(offset)
                  return f.read(4)
          def validate_package(path):
              suffix = path.suffix.lower()
              magic = read_magic(path)
              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )
              if suffix in (".xci", ".xcz") and read_magic(path, 0x100) != b"HEAD":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )
          def add_package(source, label):
              target = game_dir / source.name
              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )
              validate_package(source)
              shutil.move(str(source), str(target))
              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )
          def process_download(label):
              source = work / f"{label}.download"
              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return
              signature = read_magic(source)
              is_rar = any(
                  signature == magic[:4]
                  for magic in rar_signatures
              )
              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)
                  print(f"{label}: RAR archive detected; extracting.")
                  subprocess.run(
                      [
                          "unar",
                          "-o",
                          str(extract_dir),
                          str(source),
                      ],
                      check=True,
                  )
                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in package_extensions
                  )
                  if not packages:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ packages found "
                          f"in the {label} RAR archive."
                      )
                  for package in packages:
                      add_package(package, label)
              else:
                  print(
                      f"{label}: not a RAR archive; "
                      "checking as a direct package."
                  )
                  if signature == b"PFS0":
                      extension = ".nsp"
                  elif read_magic(source, 0x100) == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive "
                          "or direct NSP/XCI package. "
                          "Direct downloads must be NSP or XCI files."
                      )
                  target = game_dir / f"{label}{extension}"
                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )
                  shutil.move(str(source), str(target))
                  validate_package(target)
                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )
          process_download("game")
          process_download("update")
          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )
          if not packages:
              raise SystemExit("No game packages were prepared.")
          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY
          test -s "$WORK/prod.keys"

      - name: Check Available Disk Space After Game Preparation
        shell: bash
        run: |
          echo "===== Available Disk Space ====="
          df -h /
          df -k / | awk 'NR==2 {printf "Available: %.2f GiB\\n", $4/1024/1024}'

      - name: Clean Up Original Game Downloads
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          echo "===== Before Cleanup ====="
          df -h /
          echo "===== Removing Original Downloads ====="
          rm -f "$WORK"/*.download
          echo "===== Removing Extracted RAR Directories ====="
          rm -rf "$WORK"/extracted-*
          echo "===== Keeping Game Packages ====="
          ls -lh "$GAME_DIR"
          echo "===== After Cleanup ====="
          df -h /

      - name: Start disk monitor
        shell: bash
        env:
          NX_GAME_DIR: ${{ runner.temp }}/GameFiles
          NX_PROGRESS_LOG: ${{ runner.temp }}/nxnative/build-console.log
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/workflow-tools/.github/scripts/nxnative_ci_guard.py" start

      - name: Detect game title ID and select shader profile
        env:
          BASE_TITLE_ID: ${{ inputs.base_title_id }}
          NX_MONITOR_LOG: ${{ runner.temp }}/disk-monitor.log
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          if [[ -n "${BASE_TITLE_ID:-}" ]]; then
            DETECTED_ID="$BASE_TITLE_ID"
            echo "Using configured base title ID: $DETECTED_ID"
          else
            DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}
          def container_names(path, offset, magic, entry_size, name_offset):
              try:
                  with path.open("rb") as f:
                      f.seek(offset)
                      header = f.read(16)
                      if len(header) != 16 or header[:4] != magic:
                          return []
                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )
                      if count > 100000 or string_size > 100000000:
                          return []
                      entries = f.read(count * entry_size)
                      strings = f.read(string_size)
                      if len(entries) != count * entry_size:
                          return []
                      names = []
                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * entry_size + name_offset
                          )[0]
                          if offset >= len(strings):
                              continue
                          end = strings.find(b"\0", offset)
                          if end < 0:
                              continue
                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )
                      return names
              except (OSError, struct.error):
                  return []
          def pfs0_names(path):
              return container_names(path, 0, b"PFS0", 0x18, 0x10)
          def xci_names(path):
              names = []
              pending = [(0xF000, b"HFS0")]
              visited = set()
              try:
                  with path.open("rb") as f:
                      while pending:
                          container_offset, magic = pending.pop()
                          if container_offset in visited:
                              continue
                          visited.add(container_offset)
                          f.seek(container_offset)
                          header = f.read(16)
                          if len(header) != 16 or header[:4] != magic:
                              continue
                          count, string_size = struct.unpack_from(
                              "<II", header, 4
                          )
                          if count > 100000 or string_size > 100000000:
                              continue
                          entry_size = 0x40 if magic == b"HFS0" else 0x18
                          name_offset = 0x10
                          entries = f.read(count * entry_size)
                          strings = f.read(string_size)
                          data_offset = (
                              container_offset
                              + 0x10
                              + count * entry_size
                              + string_size
                          )
                          if len(entries) != count * entry_size:
                              continue
                          for i in range(count):
                              entry = i * entry_size
                              file_offset, file_size = struct.unpack_from(
                                  "<QQ", entries, entry
                              )
                              name_start = struct.unpack_from(
                                  "<I", entries, entry + name_offset
                              )[0]
                              if name_start >= len(strings):
                                  continue
                              name_end = strings.find(b"\0", name_start)
                              if name_end < 0:
                                  continue
                              name = strings[name_start:name_end].decode(
                                  errors="replace"
                              )
                              names.append(name)
                              child_offset = data_offset + file_offset
                              f.seek(child_offset)
                              child_magic = f.read(4)
                              if child_magic in (b"HFS0", b"PFS0"):
                                  pending.append((child_offset, child_magic))
              except (OSError, struct.error):
                  return names
              return names
          candidates = set()
          title_id_pattern = re.compile(
              r"(?<![0-9A-Fa-f])([0-9A-Fa-f]{16})(?:[._-]|$)"
          )
          def add_candidate(value):
              title_id = int(value, 16)
              if (title_id & 0xFFF) == 0:
                  candidates.add(f"{title_id:016X}")
          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              names = pfs0_names(path)
              if path.suffix.lower() in {".xci", ".xcz"}:
                  names.extend(xci_names(path))
              for name in names:
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )
                  if match:
                      add_candidate(match.group(1))
                  for match in title_id_pattern.finditer(name):
                      add_candidate(match.group(1))
              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )
              if match:
                  add_candidate(match.group(1))
          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )
          print(next(iter(candidates)))
          PY
            )"
          fi
          PROFILE_ID="${BASE_TITLE_ID:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi
          echo "Selected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      - name: Update shader toolchain lock and header
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"
          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"
          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi
          python "$CHAIN_SCRIPT" --header

      # ===== First pass: extract, rewrite and split shaders; stop before Metal =====
      - name: Prepare shader split and RomFS for upload
        id: prepare
        shell: bash
        env:
          DMSH_TARGETS: ios
          NX_CI_STOP_AFTER_SPLIT: "1"
          NX_CI_ROMFS_HANDOFF_DIR: ${{ runner.temp }}/romfs-handoff
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"
          mkdir -p "$RUNNER_TEMP/romfs-handoff"
          rm -f "$OUTPUT" "$RUNNER_TEMP/romfs-handoff/ready" "$RUNNER_TEMP/romfs-handoff/RomFS.img"

          echo "===== Before First Pass ====="
          df -h /

          ARGS=(
            "$GAME_DIR"
            -k "$WORK/prod.keys"
            --allow-other-metal
          )

          # Pause after the NVN shader split so the RomFS image can be uploaded
          # before Metal compiles; the second pass releases the image and builds the IPA.
          ARGS+=(--romfs separate)
          echo "Standard mode: pause after NVN shader split for RomFS upload."

          python scripts/build_ipa_from_nsp.py \
            "${ARGS[@]}" \
            -o "$OUTPUT" 2>&1 | tee "$WORK/build-console.log"

          if [[ -s "$RUNNER_TEMP/romfs-handoff/ready" && -s "$RUNNER_TEMP/romfs-handoff/RomFS.img" ]]; then
            echo "romfs_ready=true" >> "$GITHUB_OUTPUT"
            echo "Shader split completed; standalone RomFS.img is ready for upload."
            ls -lh "$RUNNER_TEMP/romfs-handoff/RomFS.img"
          elif [[ -s "$OUTPUT" ]]; then
            echo "romfs_ready=false" >> "$GITHUB_OUTPUT"
            echo "This build path completed the IPA in the first pass; no RomFS handoff is needed."
          else
            echo "::error::First pass produced neither a complete IPA nor a valid RomFS handoff."
            exit 1
          fi

      # The profile's shader tables must be the ones this split produces; when they
      # differ, keep the split's tables so the profile can be corrected from the run.
      - name: Upload split shader tables on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-split-tables
          path: |
            ${{ runner.temp }}/GameFiles/*/shader/pkg.partial/tables/
            ${{ runner.temp }}/GameFiles/*/logs/shader_split.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload RomFS as GitHub Artifact
        if: success() && steps.prepare.outputs.romfs_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-ROMFS
          path: ${{ runner.temp }}/romfs-handoff/RomFS.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # Remove the staging hard link; the original image is released by the second pass.
      - name: Remove RomFS upload staging link
        if: success() && steps.prepare.outputs.romfs_ready == 'true'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/romfs-handoff/RomFS.img"

      # ===== Second pass: reuse extraction/rewrite/split, release RomFS, build Metal and IPA =====
      - name: Build unsigned IPA
        if: success()
        shell: bash
        env:
          DMSH_TARGETS: ios
          NX_CI_RELEASE_ROMFS: "1"
          NX_CI_RELEASE_NSP_SPACE: "1"
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "===== Re-entering cached build to release RomFS and compile Metal ====="
            df -h /

            ARGS=(
              "$GAME_DIR"
              -k "$WORK/prod.keys"
              --allow-other-metal
            )

            ARGS+=(--romfs separate)

            python scripts/build_ipa_from_nsp.py \
              "${ARGS[@]}" \
              -o "$OUTPUT" 2>&1 | tee -a "$WORK/build-console.log"
          else
            echo "IPA was already completed during the first pass; skipping the second build."
          fi

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Audit Disk After Build
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          echo "========== Disk After Build =========="
          df -h /
          df -i /
          DEVELOPER_DIR="$(xcode-select -p 2>/dev/null)"
          for DIR in \
            "$HOME/Library/Developer/Xcode" \
            "$HOME/Library/Developer/CoreSimulator" \
            "$HOME/Library/Caches/com.apple.dt.Xcode" \
            "$DEVELOPER_DIR/Platforms" \
            "$DEVELOPER_DIR/Toolchains"
          do
            if [ -d "$DIR" ]; then
              echo ""
              echo "----- $DIR -----"
              du -sh "$DIR" 2>/dev/null
              du -h -d 1 "$DIR" 2>/dev/null | sort -h
            fi
          done

      - name: Stop disk monitor and print report
        if: always()
        shell: bash
        env:
          NX_GAME_DIR: ${{ runner.temp }}/GameFiles
          NX_PROGRESS_LOG: ${{ runner.temp }}/nxnative/build-console.log
          NX_MONITOR_LOG: ${{ runner.temp }}/disk-monitor.log
        run: |
          python "$GITHUB_WORKSPACE/workflow-tools/.github/scripts/nxnative_ci_guard.py" stop

      - name: Upload IPA as GitHub Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.base_title_id }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
            ${{ runner.temp }}/disk-monitor.log
            ${{ runner.temp }}/nxnative/build-console.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"

